<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能邮件任务助手</title>
    <!-- 引入 Vue3 和 Tailwind CSS -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="p-4 md:p-8">

    <div id="app" class="max-w-4xl mx-auto">
        <!-- 顶部导航 -->
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold text-xl">
                    AI</div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">智能收件箱</h1>
                    <p class="text-xs text-gray-500">自动从邮件中提取待办事项</p>
                </div>
            </div>
            <button @click="fetchTasks"
                class="bg-blue-50 text-blue-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-100 transition">
                🔄 刷新数据
            </button>
        </header>

        <!-- 任务列表区 -->
        <div v-if="loading" class="text-center py-20 text-gray-400">加载中...</div>

        <div v-else-if="tasks.length === 0" class="text-center py-20 bg-white rounded-2xl border border-gray-100">
            <div class="text-5xl mb-4">📭</div>
            <p class="text-gray-500">收件箱空空如也，AI 正在后台默默监听邮件...</p>
        </div>

        <div v-else class="space-y-4">
            <div v-for="task in tasks" :key="task.id"
                class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition">
                <!-- 任务头部 -->
                <div class="flex justify-between items-start mb-2">
                    <h2 class="text-lg font-bold text-gray-800 flex-1 pr-4">✨ {{ task.title }}</h2>
                    <span
                        class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-md font-medium whitespace-nowrap">
                        置信度: {{ (task.confidence * 100).toFixed(0) }}%
                    </span>
                </div>

                <!-- 任务内容 -->
                <p class="text-gray-600 text-sm mb-4 line-clamp-2">{{ task.description || '无详细描述' }}</p>

                <!-- 标签区 -->
                <div class="flex gap-2 text-xs text-gray-500 mb-5">
                    <span class="bg-gray-100 px-2 py-1 rounded">来源邮件ID: {{ task.source_msg_id }}</span>
                    <span v-if="task.deadline" class="bg-orange-100 text-orange-700 px-2 py-1 rounded">⏰ 截止: {{
                        formatDate(task.deadline) }}</span>
                    <span v-else class="bg-gray-100 px-2 py-1 rounded">无截止时间</span>
                </div>

                <!-- 操作按钮 -->
                <div class="flex gap-3 pt-4 border-t border-gray-50">
                    <button @click="confirmTask(task.id)"
                        class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">
                        ✅ 确认加入看板
                    </button>
                    <button @click="openEditModal(task)"
                        class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg font-medium hover:bg-gray-200 transition">
                        ✏️ 改写
                    </button>
                </div>
            </div>
        </div>

        <!-- 改写弹窗 (Modal) -->
        <div v-if="showEditModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
                <h3 class="text-xl font-bold text-gray-800 mb-4">✏️ 人工改写任务</h3>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">任务标题</label>
                    <input v-model="editingTask.title" type="text"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">截止时间 (选填)</label>
                    <input v-model="editingTask.deadline" type="datetime-local"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="flex justify-end gap-3">
                    <button @click="showEditModal = false"
                        class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
                        取消
                    </button>
                    <button @click="submitEdit"
                        class="px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition">
                        保存修改
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- 引入拆分的 JS 逻辑 -->
    <script src="./js/api.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
